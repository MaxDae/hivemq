name: E2E Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run E2E tests on'
        required: true
        default: 'main'

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pre-pull HiveMQ image
        run: docker pull hivemq/hivemq-ce:2025.5
      - name: Run unit tests
        run: mvn -B test -P '!Packaging' --file pom.xml

      - name: Package extension          # ← unpacks the ZIP before E2E
        run: mvn -B package --file pom.xml -DskipTests

      - name: Run E2E tests
        run: mvn -B failsafe:integration-test failsafe:verify -Pe2e --file pom.xml

#      - name: Run E2E tests
#        run: mvn -B verify -Pe2e --file pom.xml

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven E2E Test Results (${{ github.event.inputs.branch }})
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
