name: E2E Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run E2E tests on'
        required: true
        default: 'main'

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pre-pull HiveMQ image
        run: docker pull hivemq/hivemq-ce:2025.5

      # Ensure the extension is shaded and the ZIP is created before E2E runs
      - name: Build and Package Extension
        run: mvn clean package -Ppackaging -DskipTests -B

      - name: Run E2E tests
        run: mvn verify -Pe2e -Ppackaging -DskipUnitTests -B

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven E2E Test Results (${{ github.event.inputs.branch }})
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
