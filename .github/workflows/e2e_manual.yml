name: E2E Tests (Manual)

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run E2E tests on'
        required: true
        default: 'main'
      hivemq_image:
        description: 'HiveMQ Docker image for E2E tests'
        type: choice
        required: true
        default: 'hivemq/hivemq-ce:latest'
        options:
          - 'hivemq/hivemq-ce:latest'
          - 'hivemq/hivemq-ce:2021.3'

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    env:
      HIVEMQ_TEST_IMAGE: ${{ github.event.inputs.hivemq_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Pre-pull HiveMQ image
        run: docker pull "$HIVEMQ_TEST_IMAGE"
      - name: Run E2E tests
        run: >-
          mvn -B verify -Pe2e -Dhivemq.test.image="$HIVEMQ_TEST_IMAGE" --file pom.xml

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven E2E Test Results (${{ github.event.inputs.branch }}, ${{ env.HIVEMQ_TEST_IMAGE }})
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit