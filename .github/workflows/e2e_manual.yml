name: E2E Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run E2E tests on'
        required: true
        default: 'main'

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    env:
      HIVEMQ_TEST_IMAGE: hivemq/hivemq-ce:2021.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pre-pull HiveMQ image
        run: docker pull "$HIVEMQ_TEST_IMAGE"


      # Single verify call runs the full lifecycle in correct order:
      # compile → package (assembly creates ZIP) →
      # pre-integration-test (antrun unpacks ZIP) →
      # integration-test (failsafe runs E2E) → verify
      - name: Run E2E tests
        run: mvn -B verify -Pe2e -Dhivemq.test.image="$HIVEMQ_TEST_IMAGE" --file pom.xml

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven E2E Test Results (${{ github.event.inputs.branch }})
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit